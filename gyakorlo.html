<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gyakorló — Kódolástechnika</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script>
  MathJax = { tex:{inlineMath:[['\\(','\\)']]}, svg:{fontCache:'global'} };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
</head>
<body>
<header>
  <h1>🎮 Gyakorló — egyesével</h1>
  <p>Véletlen generált feladatok · automatikus ellenőrzés · lépésenkénti megoldás</p>
  <nav class="navbar">
    <a href="index.html">🏠 Kezdőlap</a>
    <a href="tanulas.html">📚 Tanulás</a>
    <a href="gyakorlo.html" class="current">🎮 Gyakorló</a>
    <a href="teszt.html">📝 Minta teszt</a>
  </nav>
</header>

<div class="wrap">
  <div class="topics" id="topics"></div>
  <div class="stats">
    <div class="stat"><b id="s-total">0</b><span>Megoldva</span></div>
    <div class="stat"><b id="s-correct" style="color:var(--ok)">0</b><span>Helyes</span></div>
    <div class="stat"><b id="s-streak" style="color:var(--accent)">0</b><span>Sorozat</span></div>
    <div class="stat"><b id="s-rate">—</b><span>Arány</span></div>
  </div>
  <div class="card" id="card"></div>
  <div class="controls">
    <button class="btn-ghost" id="btn-sol">💡 Megoldás mutatása</button>
    <button class="btn-primary" id="btn-next">Következő feladat →</button>
  </div>
</div>

<footer>
  Tipp: <span class="kbd">Enter</span> = ellenőrzés · A haladásod a böngészőben mentődik.
</footer>

<script src="engine.js"></script>
<script>
let state={topic:'all',current:null,answered:false};
let stats=loadStats();
function loadStats(){try{return JSON.parse(localStorage.getItem('ktstats'))||{total:0,correct:0,streak:0};}catch(e){return{total:0,correct:0,streak:0};}}
function saveStats(){localStorage.setItem('ktstats',JSON.stringify(stats));}
function renderStats(){
  s_total.textContent=stats.total; s_correct.textContent=stats.correct;
  s_streak.textContent=stats.streak; s_rate.textContent=stats.total?Math.round(100*stats.correct/stats.total)+'%':'—';
}
const $=id=>document.getElementById(id);
function newQuestion(){ state.current=KT.pickGen(state.topic)(); state.answered=false; renderQuestion(); }
function renderQuestion(){
  const q=state.current;
  $('card').innerHTML=`
    <span class="qtype">${q.type}</span>
    <div class="qtext">${q.question}</div>
    ${q.hint?`<div class="hint">💡 ${q.hint}</div>`:''}
    <div class="answer-row">
      <input type="text" id="ans" placeholder="A válaszod…" autocomplete="off" autofocus>
      <button class="btn-primary" id="btn-check">Ellenőrzés</button>
    </div>
    <div class="feedback" id="fb"></div>
    <div class="solution" id="sol"><h4>Lépésenkénti megoldás</h4>${q.solution}</div>`;
  $('sol').classList.remove('show');
  const inp=$('ans'); inp.focus();
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')checkAnswer();});
  $('btn-check').addEventListener('click',checkAnswer);
  KT.typeset($('card'));
}
function checkAnswer(){
  if(state.answered)return;
  const q=state.current; const inp=$('ans').value;
  if(inp.trim()==='')return;
  const ok=q.check(inp); const fb=$('fb'); state.answered=true; stats.total++;
  if(ok){stats.correct++;stats.streak++;fb.className='feedback ok';fb.innerHTML=`✅ <b>Helyes!</b> A válasz: <code>${q.answer}</code>`;}
  else{stats.streak=0;fb.className='feedback bad';fb.innerHTML=`❌ <b>Nem jó.</b> A helyes válasz: <code>${q.answer}</code>`;$('sol').classList.add('show');}
  saveStats();renderStats();KT.typeset($('card'));
}
function renderTopics(){
  const box=$('topics'); box.innerHTML='';
  KT.TOPICS.forEach(t=>{
    const b=document.createElement('button');
    b.className='chip'+(state.topic===t.id?' active':'');
    b.textContent=t.name;
    b.onclick=()=>{state.topic=t.id;renderTopics();newQuestion();};
    box.appendChild(b);
  });
}
$('btn-next').addEventListener('click',newQuestion);
$('btn-sol').addEventListener('click',()=>{$('sol').classList.toggle('show');KT.typeset($('sol'));});
renderTopics();renderStats();newQuestion();
</script>
</body>
</html>
